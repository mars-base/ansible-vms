---

# List all VMs from vms.csv and show their status
# Usage: ap playbooks/list-vms.yaml

- name: List virtual machines
  gather_facts: false
  hosts: "{{ HOSTS | default('kvm_hosts') }}"
  become: true
  become_user: root
  become_method: sudo
  tasks:
    - name: Read vms.csv
      read_csv:
        path: "{{ vm_csv_file | default(inventory_dir + '/vms.csv') }}"
      register: _vms_csv
      delegate_to: localhost

    - name: Filter VMs for this host
      set_fact:
        _vms: "{{ _vms_csv.list | selectattr('host', 'equalto', inventory_hostname) | list }}"

    - name: Get VM status
      shell: virsh dominfo {{ item.name }} 2>/dev/null || echo "NOT_FOUND"
      register: _vm_status
      changed_when: false
      loop: "{{ _vms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Get VM IP from ARP
      shell: ip neigh show dev {{ item.item.bridge }} 2>/dev/null | grep -i "{{ item.item.mac }}" | awk '{print $1}' | head -1
      register: _vm_ip
      changed_when: false
      failed_when: false
      when: item.rc == 0
      loop: "{{ _vm_status.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Show VM list
      debug:
        msg: |
          {% for vm in _vms %}
          {% set idx = loop.index0 %}
          {% set status = _vm_status.results[idx] %}
          {% if status.rc == 0 %}
          {% set state = status.stdout_lines | select('match', 'State') | list | first | default('') | regex_replace('State:\s*', '') %}
          {{ '%-20s' | format(vm.name) }} {{ '%-8s' | format(vm.type) }} {{ '%-6s' | format(vm.vcpus + ' vCPU') }} {{ '%-10s' | format(vm.memory_mb + ' MB') }} {{ '%-6s' | format(vm.os) }} {{ state }}
          {% else %}
          {{ '%-20s' | format(vm.name) }} NOT DEFINED
          {% endif %}
          {% endfor %}
