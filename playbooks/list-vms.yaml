---

# List all VMs from vms.csv and show their status
# Usage: ap playbooks/list-vms.yaml
#        ap playbooks/list-vms.yaml -e "kvm_host=local"  # 只列出指定宿主的VM

- name: List virtual machines
  gather_facts: false
  hosts: "{{ HOSTS | default('kvm_hosts') }}"
  become: true
  become_user: root
  become_method: sudo
  tasks:
    - name: Read vms.csv
      read_csv:
        path: "{{ vm_csv_file | default(inventory_dir + '/vms.csv') }}"
      register: _vms_csv
      delegate_to: localhost

    - name: Filter VMs for this host
      set_fact:
        _vms: "{{ _vms_csv.list | selectattr('host', 'equalto', inventory_hostname) | list }}"

    - name: Filter VMs by kvm_host if specified
      set_fact:
        _vms: "{{ _vms | selectattr('host', 'equalto', kvm_host) | list }}"
      when: kvm_host is defined

    - name: Get VM status
      shell: virsh dominfo {{ item.name }} 2>/dev/null || echo "NOT_FOUND"
      register: _vm_status
      changed_when: false
      failed_when: false
      loop: "{{ _vms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Get VM IP from ARP
      shell: ip neigh show dev {{ item.item.bridge }} 2>/dev/null | grep -i "{{ item.item.mac }}" | awk '/REACHABLE/{print $1; found=1; exit} {last=$1} END{if(!found) print last}'
      register: _vm_ip
      changed_when: false
      failed_when: false
      when: "'NOT_FOUND' not in item.stdout"
      loop: "{{ _vm_status.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Show VM list
      debug:
        msg: |
          {{ '%-12s' | format('Host') }} {{ '%-20s' | format('Name') }} {{ '%-15s' | format('IP') }} {{ '%-8s' | format('Type') }} {{ '%-10s' | format('CPU') }} {{ '%-10s' | format('Memory') }} {{ '%-12s' | format('OS') }} State
          {{ '-' * 12 }} {{ '-' * 20 }} {{ '-' * 15 }} {{ '-' * 8 }} {{ '-' * 10 }} {{ '-' * 10 }} {{ '-' * 12 }} {{ '-' * 10 }}
          {% for vm in _vms %}
          {% set idx = loop.index0 %}
          {% set status = _vm_status.results[idx] %}
          {% set ip = _vm_ip.results[idx].stdout | default('-') if _vm_ip.results[idx] is not skipped else '-' %}
          {% if 'NOT_FOUND' not in status.stdout %}
          {% set state = status.stdout_lines | select('match', 'State') | list | first | default('') | regex_replace('State:\s*', '') %}
          {{ '%-12s' | format(vm.host) }} {{ '%-20s' | format(vm.name) }} {{ '%-15s' | format(ip) }} {{ '%-8s' | format(vm.type) }} {{ '%-10s' | format(vm.vcpus + ' vCPU') }} {{ '%-10s' | format(vm.memory_mb + ' MB') }} {{ '%-12s' | format(vm.os) }} {{ state }}
          {% else %}
          {{ '%-12s' | format(vm.host) }} {{ '%-20s' | format(vm.name) }} {{ '%-15s' | format('-') }} {{ '%-8s' | format('-') }} {{ '%-10s' | format('-') }} {{ '%-10s' | format('-') }} {{ '%-12s' | format('-') }} NOT DEFINED
          {% endif %}
          {% endfor %}
