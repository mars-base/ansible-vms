---

# Attach data disk to a running VM (hot-plug, no reboot needed)
# Usage:
#   ap playbooks/attach-data-disk.yaml -e vm_name=debian13-01
#
# Reads data_disk_gb from vms.csv. VM must have data_disk_gb > 0 in CSV.

- name: Attach data disk to VM
  gather_facts: false
  hosts: "{{ HOSTS | default('kvm_hosts') }}"
  become: true
  become_user: root
  become_method: sudo
  tasks:
    - name: Check vm_name is specified
      assert:
        that: vm_name is defined and vm_name != ''
        fail_msg: "vm_name is required. Usage: -e vm_name=<name>"

    - name: Read vms.csv
      read_csv:
        path: "{{ vm_csv_file | default(inventory_dir + '/vms.csv') }}"
      register: _vms_csv
      delegate_to: localhost

    - name: Filter VM by name
      set_fact:
        _vms: "{{ _vms_csv.list | selectattr('host', 'equalto', inventory_hostname) | selectattr('name', 'equalto', vm_name) | list }}"

    - name: Check VM found
      assert:
        that: _vms | length > 0
        fail_msg: "VM '{{ vm_name }}' not found in vms.csv for host '{{ inventory_hostname }}'"

    - name: Check data_disk_gb in vms.csv
      assert:
        that: _vms[0].data_disk_gb | default('') | length > 0 and _vms[0].data_disk_gb | int > 0
        fail_msg: "VM '{{ vm_name }}' has no data disk defined in vms.csv (data_disk_gb is empty or 0). Set data_disk_gb > 0 in vms.csv first."

    - name: Set data disk size
      set_fact:
        _data_disk_gb: "{{ _vms[0].data_disk_gb }}"

    - name: Check if VM is defined in libvirt
      shell: virsh domstate {{ _vms[0].name }} 2>/dev/null
      register: _vm_check
      failed_when: false
      changed_when: false

    - name: Check VM exists
      assert:
        that: _vm_check.rc == 0
        fail_msg: "VM '{{ vm_name }}' is not defined in libvirt. Create it first with create-vm.yaml."

    - name: Set storage path
      set_fact:
        _storage_dir: "{{ (_vms[0].storage_dir if _vms[0].storage_dir | default('') | length > 0 else vm_images_dir | default('/var/lib/libvirt/images')) }}/{{ _vms[0].name }}"

    - name: Set data disk path
      set_fact:
        _data_disk: "{{ _storage_dir }}/{{ _vms[0].name }}-data.qcow2"

    - name: Set disk device and bus based on VM type
      set_fact:
        _disk_dev: "{{ 'sdb' if _vms[0].type | default('linux') == 'windows' else 'vdb' }}"
        _disk_bus: "{{ 'scsi' if _vms[0].type | default('linux') == 'windows' else 'virtio' }}"

    - name: Check if data disk already attached
      shell: virsh domblklist {{ _vms[0].name }} | grep -q "data.qcow2"
      register: _disk_attached
      failed_when: false
      changed_when: false

    - name: Attach data disk
      when: _disk_attached.rc != 0
      block:
        - name: Create data disk qcow2
          shell: |
            qemu-img create -f qcow2 "{{ _data_disk }}" "{{ _data_disk_gb }}G"

        - name: Hot-plug data disk (--config --live)
          shell: |
            virsh attach-disk {{ _vms[0].name }} \
              "{{ _data_disk }}" {{ _disk_dev }} \
              --driver qemu --subdriver qcow2 \
              --targetbus {{ _disk_bus }} \
              --config --live

        - name: Show result
          debug:
            msg: "Data disk ({{ _data_disk_gb }}G) attached to {{ _vms[0].name }} as {{ _disk_dev }} (bus: {{ _disk_bus }})."

    - name: Skip - data disk already attached
      debug:
        msg: "Data disk already attached to {{ _vms[0].name }}, skipping."
      when: _disk_attached.rc == 0
