---

# Manage VM snapshots (create, list, revert, delete)
# Usage:
#   # Create snapshot (default: shutdown VM first for disk consistency)
#   ap playbooks/snapshot-vm.yaml -e vm_name=debian12-01 -e snap_action=create
#
#   # Create snapshot without shutdown (live snapshot, faster but less safe)
#   ap playbooks/snapshot-vm.yaml -e vm_name=debian12-01 -e snap_action=create -e halt=false
#
#   # Create snapshot with custom name and description
#   ap playbooks/snapshot-vm.yaml -e vm_name=debian12-01 -e snap_action=create -e snapshot_name=before-upgrade -e snapshot_desc="Before kernel upgrade"
#
#   # List all snapshots
#   ap playbooks/snapshot-vm.yaml -e vm_name=debian12-01 -e snap_action=list
#
#   # Revert to snapshot (requires confirmation)
#   ap playbooks/snapshot-vm.yaml -e vm_name=debian12-01 -e snap_action=revert -e snapshot_name=before-upgrade -e confirm=true
#
#   # Delete snapshot
#   ap playbooks/snapshot-vm.yaml -e vm_name=debian12-01 -e snap_action=delete -e snapshot_name=before-upgrade

- name: Manage VM snapshots
  gather_facts: false
  hosts: "{{ HOSTS | default('kvm_hosts') }}"
  become: true
  become_user: root
  become_method: sudo
  tasks:
    - name: Check vm_name is specified
      assert:
        that: vm_name is defined and vm_name != ''
        fail_msg: "vm_name is required. Usage: -e vm_name=<name> -e snap_action=<create|list|revert|delete>"

    - name: Check snap_action is valid
      assert:
        that: snap_action is defined and snap_action in ['create', 'list', 'revert', 'delete']
        fail_msg: "snap_action is required and must be one of: create, list, revert, delete"

    - name: Check snapshot_name for revert/delete
      assert:
        that: snapshot_name is defined and snapshot_name != ''
        fail_msg: "snapshot_name is required for {{ snap_action }} action. Usage: -e snapshot_name=<name>"
      when: snap_action in ['revert', 'delete']

    - name: Check confirm flag for revert
      assert:
        that: confirm | default(false) | bool
        fail_msg: "Revert is a destructive operation. Add -e confirm=true to proceed"
      when: snap_action == 'revert'

    - name: Read vms.csv
      read_csv:
        path: "{{ vm_csv_file | default(inventory_dir + '/vms.csv') }}"
      register: _vms_csv
      delegate_to: localhost

    - name: Filter VM by name
      set_fact:
        _vms: "{{ _vms_csv.list | selectattr('host', 'equalto', inventory_hostname) | selectattr('name', 'equalto', vm_name) | list }}"

    - name: Check VM found
      assert:
        that: _vms | length > 0
        fail_msg: "VM '{{ vm_name }}' not found in vms.csv for host '{{ inventory_hostname }}'"

    - name: Check VM exists in libvirt
      shell: virsh domstate {{ _vms[0].name }} 2>/dev/null
      register: _vm_check
      failed_when: false
      changed_when: false

    - name: Assert VM exists in libvirt
      assert:
        that: _vm_check.rc == 0
        fail_msg: "VM '{{ vm_name }}' is not defined in libvirt. Create it first with create-vm.yaml"

    # ===== CREATE =====

    - name: Generate snapshot timestamp
      shell: date +%Y%m%d-%H%M%S
      register: _snap_timestamp
      changed_when: false
      when: snap_action == 'create' and (snapshot_name is not defined or snapshot_name == '')

    - name: Set snapshot name
      set_fact:
        _snapshot_name: "{{ snapshot_name if (snapshot_name is defined and snapshot_name != '') else 'snap-' + _snap_timestamp.stdout }}"
      when: snap_action == 'create'

    - name: Check VM state before halt
      shell: virsh domstate {{ _vms[0].name }}
      register: _vm_state_before
      changed_when: false
      when: snap_action == 'create' and halt | default(true) | bool

    - name: Shutdown VM for snapshot
      shell: virsh shutdown {{ _vms[0].name }}
      when: snap_action == 'create' and halt | default(true) | bool and _vm_state_before.stdout == 'running'

    - name: Wait for VM to stop
      shell: virsh domstate {{ _vms[0].name }}
      register: _vm_state_wait
      until: _vm_state_wait.stdout == 'shut off'
      retries: 90
      delay: 2
      changed_when: false
      when: snap_action == 'create' and halt | default(true) | bool and _vm_state_before.stdout == 'running'

    - name: Create snapshot
      shell: "virsh snapshot-create-as {{ _vms[0].name }} {{ _snapshot_name }}{% if snapshot_desc is defined and snapshot_desc != '' %} --description '{{ snapshot_desc }}'{% endif %}"
      register: _snapshot_create
      when: snap_action == 'create'

    - name: Restart VM after snapshot
      shell: virsh start {{ _vms[0].name }}
      when: snap_action == 'create' and halt | default(true) | bool and _vm_state_before.stdout == 'running'

    # ===== REVERT =====

    - name: Check snapshot exists for revert
      shell: "virsh snapshot-info {{ _vms[0].name }} {{ snapshot_name }} 2>/dev/null"
      register: _snap_exists_revert
      failed_when: false
      changed_when: false
      when: snap_action == 'revert'

    - name: Assert snapshot exists for revert
      assert:
        that: _snap_exists_revert.rc == 0
        fail_msg: "Snapshot '{{ snapshot_name }}' not found for VM '{{ vm_name }}'"
      when: snap_action == 'revert'

    - name: Check VM state before revert
      shell: "virsh domstate {{ _vms[0].name }}"
      register: _vm_state_before_revert
      changed_when: false
      when: snap_action == 'revert'

    - name: Shutdown VM before revert
      shell: "virsh shutdown {{ _vms[0].name }}"
      when: snap_action == 'revert' and _vm_state_before_revert.stdout == 'running'

    - name: Wait for VM to stop before revert
      shell: "virsh domstate {{ _vms[0].name }}"
      register: _vm_state_wait_revert
      until: _vm_state_wait_revert.stdout == 'shut off'
      retries: 90
      delay: 2
      changed_when: false
      when: snap_action == 'revert' and _vm_state_before_revert.stdout == 'running'

    - name: Revert to snapshot
      shell: "virsh snapshot-revert {{ _vms[0].name }} {{ snapshot_name }}"
      register: _snapshot_revert
      when: snap_action == 'revert'

    - name: Start VM if was running before revert
      shell: "virsh start {{ _vms[0].name }}"
      when: snap_action == 'revert' and _vm_state_before_revert.stdout == 'running'

    # ===== DELETE =====

    - name: Check snapshot exists for delete
      shell: "virsh snapshot-info {{ _vms[0].name }} {{ snapshot_name }} 2>/dev/null"
      register: _snap_exists_delete
      failed_when: false
      changed_when: false
      when: snap_action == 'delete'

    - name: Assert snapshot exists for delete
      assert:
        that: _snap_exists_delete.rc == 0
        fail_msg: "Snapshot '{{ snapshot_name }}' not found for VM '{{ vm_name }}'"
      when: snap_action == 'delete'

    - name: Delete snapshot
      shell: "virsh snapshot-delete {{ _vms[0].name }} {{ snapshot_name }}"
      register: _snapshot_delete
      when: snap_action == 'delete'

    # ===== OPERATION RESULT =====

    - name: Show create result
      debug:
        msg: "Snapshot '{{ _snapshot_name }}' created for VM '{{ vm_name }}'"
      when: snap_action == 'create'

    - name: Show revert result
      debug:
        msg: "VM '{{ vm_name }}' reverted to snapshot '{{ snapshot_name }}' (state: {{ _vm_state_before_revert.stdout }})"
      when: snap_action == 'revert'

    - name: Show delete result
      debug:
        msg: "Snapshot '{{ snapshot_name }}' deleted from VM '{{ vm_name }}'"
      when: snap_action == 'delete'

    # ===== SNAPSHOT LIST (always shown at the end) =====

    - name: Get snapshot names
      shell: "virsh snapshot-list {{ _vms[0].name }} --name"
      register: _snapshot_names
      changed_when: false

    - name: Get snapshot XML details
      shell: |
        xml=$(virsh snapshot-dumpxml {{ _vms[0].name }} {{ item }} 2>/dev/null)
        name=$(echo "$xml" | grep -oP '<name>\K[^<]+')
        desc=$(echo "$xml" | grep -oP '<description>\K[^<]+' || echo '-')
        epoch=$(echo "$xml" | grep -oP '<creationTime>\K[^<]+')
        created=$(date -d @"$epoch" '+%Y-%m-%d %H:%M:%S' 2>/dev/null || echo '-')
        state=$(echo "$xml" | grep -oP '<state>\K[^<]+')
        echo "NAME=${name}"
        echo "DESC=${desc}"
        echo "CREATED=${created}"
        echo "STATE=${state}"
      register: _snapshot_xmls
      changed_when: false
      loop: "{{ _snapshot_names.stdout_lines }}"
      when: _snapshot_names.stdout_lines | length > 0

    - name: Get current snapshot
      shell: "virsh snapshot-current {{ _vms[0].name }} --name 2>/dev/null || echo ''"
      register: _snapshot_current
      changed_when: false

    - name: Show snapshot list
      debug:
        msg: |
          Snapshots for VM '{{ vm_name }}':
          {% if _snapshot_xmls is not skipped and _snapshot_xmls.results | length > 0 %}
          {% for snap in _snapshot_xmls.results %}
          {% set vars = {} %}
          {% for line in snap.stdout_lines %}
          {% set _ = vars.update({line.split('=')[0]: line.split('=')[1:] | join('=')}) %}
          {% endfor %}
          ---
          Name:        {{ vars.NAME | default('-') }}
          Description: {{ vars.DESC | default('-') }}
          Created:     {{ vars.CREATED | default('-') }}
          State:       {{ vars.STATE | default('-') }}
          Current:     {{ 'yes' if vars.NAME == _snapshot_current.stdout | trim else 'no' }}
          {% endfor %}
          {% else %}
          (no snapshots)
          {% endif %}
