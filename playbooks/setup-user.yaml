---
# Setup user account on VMs
#
# Usage:
#   # Create user with SSH key and passwordless sudo
#   ap playbooks/setup-user.yaml -e "HOSTS=debian12-01" -e "username=diwen"
#
#   # Specify SSH public key file
#   ap playbooks/setup-user.yaml -e "HOSTS=debian12-01" -e "username=diwen" -e "ssh_pubkey=/path/to/id_rsa.pub"
#
#   # Multiple VMs (using host group)
#   ap playbooks/setup-user.yaml -e "HOSTS=vm_dev" -e "username=diwen"

- name: Setup user account
  hosts: "{{ HOSTS | default('vms') }}"
  become: true
  gather_facts: false

  vars:
    _username: "{{ username | default('admin') }}"
    _user_shell: "{{ user_shell | default('/bin/bash') }}"
    _user_groups: "{{ user_groups | default('sudo') }}"
    _ssh_pubkey_file: "{{ ssh_pubkey | default('~/.ssh/id_rsa.pub') }}"
    _passwordless_sudo: "{{ passwordless_sudo | default(true) }}"

  tasks:
    - name: Read SSH public key
      ansible.builtin.slurp:
        src: "{{ _ssh_pubkey_file | expanduser }}"
      register: pubkey_content
      delegate_to: localhost

    - name: Set SSH public key fact
      ansible.builtin.set_fact:
        ssh_key: "{{ pubkey_content.content | b64decode | trim }}"

    - name: Create user
      ansible.builtin.user:
        name: "{{ _username }}"
        shell: "{{ _user_shell }}"
        groups: "{{ _user_groups }}"
        append: true
        create_home: true
        state: present

    - name: Configure SSH authorized key
      ansible.builtin.authorized_key:
        user: "{{ _username }}"
        key: "{{ ssh_key }}"
        state: present

    - name: Configure passwordless sudo
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ _username }}"
        content: "{{ _username }} ALL=(ALL) NOPASSWD:ALL"
        mode: '0440'
        validate: 'visudo -cf %s'
      when: _passwordless_sudo | bool

    - name: Display result
      ansible.builtin.debug:
        msg: "User {{ _username }} configured on {{ inventory_hostname }}"
