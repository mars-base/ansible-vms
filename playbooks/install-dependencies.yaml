---
# Install system dependencies playbook

- name: Install system dependencies
  hosts: "{{ hosts | default('all') }}"
  become: true
  vars:
    base_packages:
      - vim
      - curl
      - wget
      - git
      - htop
      - tree
      - unzip
      - net-tools
      - ca-certificates
    debian_kvm_packages:
      - qemu-kvm
      - qemu-utils
      - libvirt-daemon-system
      - libvirt-clients
      - ovmf
      - swtpm
      - virtinst
      - virt-viewer
      - bridge-utils
      - cloud-image-utils
      - genisoimage
    redhat_packages:
      - vim-enhanced
      - curl
      - git
      - htop
      - tree
      - unzip
      - net-tools
      - ca-certificates
      - qemu-kvm
      - qemu-img
      - libvirt-daemon-kvm
      - libvirt-client
      - libvirt-daemon-config-network
      - edk2-ovmf
      - swtpm
      - virt-install
      - virt-viewer
      - genisoimage
    # Fedora no longer ships wget; wget2 is its replacement
    redhat_wget_package: "{{ 'wget2' if ansible_distribution == 'Fedora' else 'wget' }}"
    redhat_libvirt_sockets:
      - virtqemud.socket
      - virtnetworkd.socket
      - virtnodedevd.socket
      - virtstoraged.socket
      - virtsecretd.socket
      - virtlogd.socket
      - virtlockd.socket
      - virtproxyd.socket

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install base packages (Debian/Ubuntu)
      apt:
        name: "{{ base_packages }}"
        state: present
      when: ansible_os_family == "Debian"

    - name: Install KVM packages (Debian/Ubuntu)
      apt:
        name: "{{ debian_kvm_packages }}"
        state: present
      when: ansible_os_family == "Debian"

    - name: Enable and start libvirtd
      service:
        name: libvirtd
        state: started
        enabled: yes
      when: ansible_os_family == "Debian"

    - name: Enable and start virtlogd
      service:
        name: virtlogd
        state: started
        enabled: yes
      when: ansible_os_family == "Debian"

    - name: Enable and start libvirt-guests
      service:
        name: libvirt-guests
        state: started
        enabled: yes
      when: ansible_os_family == "Debian"

    - name: Install packages (Fedora/Rocky)
      dnf:
        name: "{{ redhat_packages + [redhat_wget_package] }}"
        state: present
      when: ansible_os_family == "RedHat"

    - name: Check modular libvirt socket units
      stat:
        path: /usr/lib/systemd/system/{{ item }}
      loop: "{{ redhat_libvirt_sockets }}"
      register: _redhat_libvirt_sockets
      when: ansible_os_family == "RedHat"

    - name: Enable and start modular libvirt daemons
      systemd:
        name: "{{ item.item }}"
        state: started
        enabled: yes
      loop: "{{ _redhat_libvirt_sockets.results | default([]) }}"
      when: item.stat is defined and item.stat.exists
