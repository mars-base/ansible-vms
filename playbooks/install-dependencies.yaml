---
# Install system dependencies playbook

- name: Install system dependencies
  hosts: "{{ hosts | default('all') }}"
  become: true
  vars:
    base_packages:
      - vim
      - curl
      - wget
      - git
      - htop
      - tree
      - unzip
      - net-tools
      - ca-certificates
      - software-properties-common
    kvm_packages:
      - qemu-kvm
      - qemu-utils
      - libvirt-daemon-system
      - libvirt-clients
      - ovmf
      - swtpm
      - virtinst
      - virt-viewer
      - bridge-utils
      - cloud-image-utils
      - genisoimage

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install base packages
      apt:
        name: "{{ base_packages }}"
        state: present
      when: ansible_os_family == "Debian"

    - name: Install KVM packages
      apt:
        name: "{{ kvm_packages }}"
        state: present
      when: ansible_os_family == "Debian"

    - name: Enable and start libvirtd
      service:
        name: libvirtd
        state: started
        enabled: yes
      when: ansible_os_family == "Debian"

    - name: Enable and start virtlogd
      service:
        name: virtlogd
        state: started
        enabled: yes
      when: ansible_os_family == "Debian"

    - name: Enable and start libvirt-guests
      service:
        name: libvirt-guests
        state: started
        enabled: yes
      when: ansible_os_family == "Debian"

    - name: Install base packages (RedHat/CentOS)
      yum:
        name: "{{ base_packages }}"
        state: present
      when: ansible_os_family == "RedHat"

    - name: Install base packages (Alpine)
      apk:
        name: "{{ base_packages }}"
        state: present
      when: ansible_os_family == "Alpine"
