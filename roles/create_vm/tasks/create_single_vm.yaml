---

- name: "Check if VM {{ vm.name }} exists"
  shell: virsh dominfo {{ vm.name }} 2>/dev/null
  register: _vm_exists
  changed_when: false
  failed_when: false

- name: "Skip {{ vm.name }} - already exists"
  debug:
    msg: "VM {{ vm.name }} already exists, skipping."
  when: _vm_exists.rc == 0

- name: "Create VM {{ vm.name }}"
  when: _vm_exists.rc != 0
  block:
    - name: "Set storage directory for {{ vm.name }}"
      set_fact:
        _vm_storage_dir: "{{ (vm.storage_dir if vm.storage_dir | default('') | length > 0 else vm_images_dir) }}/{{ vm.name }}"

    - name: "Create storage directory for {{ vm.name }}"
      file:
        path: "{{ _vm_storage_dir }}"
        state: directory
        mode: "0755"

    - name: "Check macOS assets exist for {{ vm.name }}"
      stat:
        path: "{{ item }}"
      register: _macos_assets
      loop:
        - "{{ vm.base_image }}"
        - "{{ macos_opencore_image }}"
        - "{{ macos_ovmf_code }}"
        - "{{ macos_ovmf_vars_template }}"
      when: vm.type | default('linux') == 'macos'

    - name: "Assert macOS assets are present for {{ vm.name }}"
      assert:
        that: _macos_assets.results | map(attribute='stat.exists') | select | length == _macos_assets.results | length
        fail_msg: "Missing macOS asset(s). Copy them to {{ macos_asset_dir }} first (see docs/macos.md)."
      when: vm.type | default('linux') == 'macos'

    - name: "Create qcow2 overlay for {{ vm.name }}"
      shell: |
        qemu-img create -f qcow2 -F qcow2 \
          -b "{{ vm.base_image }}" \
          "{{ _vm_storage_dir }}/{{ vm.name }}.qcow2" \
          "{{ vm.disk_gb }}G"

    - name: "Create data disk for {{ vm.name }}"
      shell: |
        qemu-img create -f qcow2 \
          "{{ _vm_storage_dir }}/{{ vm.name }}-data.qcow2" \
          "{{ vm.data_disk_gb }}G"
      when: vm.data_disk_gb is defined and vm.data_disk_gb | int > 0

    - name: "Copy OVMF VARS for {{ vm.name }}"
      copy:
        src: "{{ macos_ovmf_vars_template if vm.type | default('linux') == 'macos' else (ovmf_vars_ms if vm.type | default('linux') == 'windows' else ovmf_vars) }}"
        dest: "{{ _vm_storage_dir }}/{{ vm.name }}-OVMF_VARS.fd"
        remote_src: true
        mode: "0644"
      when: (vm.firmware | default('')) | length > 0 and vm.firmware == 'efi'

    - name: "Create OpenCore EFI overlay for {{ vm.name }}"
      shell: |
        qemu-img create -f qcow2 -F qcow2 \
          -b "{{ macos_opencore_image }}" \
          "{{ _vm_storage_dir }}/{{ vm.name }}-OpenCore.qcow2"
      args:
        creates: "{{ _vm_storage_dir }}/{{ vm.name }}-OpenCore.qcow2"
      when: vm.type | default('linux') == 'macos'


    # Linux cloud-init: generate seed ISO
    - name: "Create cloud-init directory for {{ vm.name }}"
      file:
        path: "/tmp/{{ vm.name }}-cloudinit"
        state: directory
        mode: "0755"
      when: vm.type | default('linux') == 'linux'

    - name: "Generate cloud-init user-data for {{ vm.name }}"
      template:
        src: user-data.j2
        dest: "/tmp/{{ vm.name }}-cloudinit/user-data"
        mode: "0644"
      when: vm.type | default('linux') == 'linux'

    - name: "Generate cloud-init meta-data for {{ vm.name }}"
      template:
        src: meta-data.j2
        dest: "/tmp/{{ vm.name }}-cloudinit/meta-data"
        mode: "0644"
      when: vm.type | default('linux') == 'linux'

    - name: "Check if static IP is configured for {{ vm.name }}"
      set_fact:
        _has_static_ip: "{{ vm.ip is defined and vm.ip | length > 0 }}"
      when: vm.type | default('linux') == 'linux'

    - name: "Generate cloud-init network-config for {{ vm.name }}"
      template:
        src: network-config.j2
        dest: "/tmp/{{ vm.name }}-cloudinit/network-config"
        mode: "0644"
      when:
        - vm.type | default('linux') == 'linux'
        - _has_static_ip | bool

    - name: "Generate cloud-init ISO for {{ vm.name }}"
      shell: |
        cd /tmp/{{ vm.name }}-cloudinit && \
        {% if _has_static_ip | default(false) | bool %}
        genisoimage -output {{ _vm_storage_dir }}/{{ vm.name }}-seed.iso \
          -input-charset utf-8 \
          -volid cidata -joliet -rock \
          user-data meta-data network-config
        {% else %}
        genisoimage -output {{ _vm_storage_dir }}/{{ vm.name }}-seed.iso \
          -input-charset utf-8 \
          -volid cidata -joliet -rock \
          user-data meta-data
        {% endif %}
      args:
        creates: "{{ _vm_storage_dir }}/{{ vm.name }}-seed.iso"
      when: vm.type | default('linux') == 'linux'

    - name: "Generate domain XML for {{ vm.name }}"
      template:
        src: "domain-{{ vm.type | default('linux') }}.xml.j2"
        dest: "/tmp/{{ vm.name }}.xml"
        mode: "0644"

    - name: "Define VM {{ vm.name }}"
      shell: virsh define /tmp/{{ vm.name }}.xml

    - name: "Clean up XML file for {{ vm.name }}"
      file:
        path: "/tmp/{{ vm.name }}.xml"
        state: absent

    - name: "Start VM {{ vm.name }}"
      shell: virsh start {{ vm.name }}
      when: vm.autostart | default(vm_default_autostart) | bool

    - name: "Set VM {{ vm.name }} autostart"
      shell: virsh autostart {{ vm.name }}
      when: vm.autostart | default(vm_default_autostart) | bool
