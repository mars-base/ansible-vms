---

vm_images_dir: /var/lib/libvirt/images
vm_csv_file: "{{ inventory_dir }}/vms.csv"

# OVMF firmware - Secure Boot (Windows)
ovmf_code_ms: /usr/share/OVMF/OVMF_CODE.ms.fd
ovmf_vars_ms: /usr/share/OVMF/OVMF_VARS.ms.fd
# OVMF firmware - Standard (Linux)
ovmf_code: /usr/share/OVMF/OVMF_CODE.fd
ovmf_vars: /usr/share/OVMF/OVMF_VARS.fd

# macOS (Hackintosh) assets. These live outside the repo, copied from OSX-KVM
# once (see docs/macos.md). base image + OpenCore EFI are shared read-only
# templates; each VM gets its own qcow2 overlay of OpenCore and its own nvram.
macos_asset_dir: /home/fish/bucket/kvm/macos
macos_opencore_image: "{{ macos_asset_dir }}/OpenCore.qcow2"
# OSX-KVM's bundled OVMF_CODE_4M.fd uses a RAM-backed/EmuVariable store that
# never reads or writes the on-disk VARS file, so any blessed NVRAM is invisible
# to it. Use the host's own distro persistent pair instead (see docs/macos.md).
macos_ovmf_code: /usr/share/OVMF/OVMF_CODE_4M.fd
# Baked on a q35 machine whose SATA is the built-in controller (PCI 1f:2), which
# is what libvirt's <controller type='sata'> also resolves to -- see docs/macos.md.
macos_ovmf_vars_template: "{{ macos_asset_dir }}/OVMF_VARS-blessed.fd"
macos_osk: "ourhardworkbythesewordsguardedpleasedontsteal(c)AppleComputerInc"
macos_cpu_model: Skylake-Client

qemu_emulator: /usr/bin/qemu-system-x86_64

# Architecture defaults
vm_default_arch: x86_64
vm_default_machine: q35
vm_default_firmware: efi
vm_default_firmware_linux: bios
vm_default_firmware_windows: efi

# Clock: windows=localtime, linux=utc
vm_default_clock_offset_linux: utc
vm_default_clock_offset_windows: localtime

vm_default_poweroff_action: destroy
vm_default_reboot_action: restart
vm_default_crash_action: destroy

# Disk/NIC: windows uses scsi, linux uses virtio (virtio-blk)
vm_default_disk_bus_linux: virtio
vm_default_disk_bus_windows: scsi
vm_default_nic_model: virtio

# Graphics
vm_default_graphics_type: spice
vm_default_graphics_listen: 127.0.0.1
vm_default_video_model: qxl

# Devices
vm_default_tpm: true
vm_default_memballoon: true
vm_default_rng: true

# Autostart: whether VM starts automatically on host boot
vm_default_autostart: false

# Cloud-init defaults for Linux VMs
vm_cloud_init_user: root
vm_cloud_init_ssh_password: ""
vm_cloud_init_timezone: Asia/Shanghai
vm_cloud_init_locale: en_US.UTF-8
# Built-in packages (always installed)
vm_cloud_init_packages:
  - qemu-guest-agent
  - curl
  - wget
# User-defined packages (merged with built-in)
vm_cloud_init_extra_packages: []
